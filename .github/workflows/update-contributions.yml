name: Update contribution signal

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contribution-signal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test renderer
        run: python -m unittest discover -s tests -v
      - name: Render public contribution calendar
        run: python scripts/render_contributions.py
      - name: Commit changed signal
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "Update contribution signal"
          git push
